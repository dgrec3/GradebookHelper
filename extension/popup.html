<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gradebook Enhancer</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-page">
  <h1>Gradebook Enhancer</h1>

  <label class="switch-row">
    <input type="checkbox" id="enabled">
    <span>Highlighting on</span>
  </label>

  <div id="details">
    <h2>Bands</h2>
    <div id="band-summary" class="band-summary"></div>

    <label class="switch-row">
      <input type="checkbox" id="final-include">
      <span>Include final grade</span>
    </label>

    <label class="switch-row">
      <input type="checkbox" id="multi-enabled">
      <span>Split cells with multiple matches</span>
    </label>

    <h2>Score codes</h2>
    <div id="score-codes"></div>

    <h2>Flags</h2>
    <label class="switch-row">
      <input type="checkbox" id="flag-tags">
      <span>Text tags instead of icons</span>
    </label>
    <div id="flags"></div>
  </div>

  <button type="button" id="open-options" class="primary">Edit colors &amp; thresholds…</button>
  <button type="button" id="open-demo" class="secondary demo-button">See it on a sample gradebook</button>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
